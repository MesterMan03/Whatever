[package]
name = "whatever-engine"
version.workspace = true
edition = "2024"
publish = false

[lib]
name = "whatever_engine"

[dependencies]
winit          = "0.30"
wgpu           = "23"
bytemuck       = { version = "1", features = ["derive"] }
glam           = "0.29"
rapier3d       = { version = "=0.36.1", features = ["enhanced-determinism", "serde-serialize"] }
image          = { version = "0.25", default-features = false, features = ["png", "ico"] }
serde          = { version = "1", features = ["derive"] }
toml           = "0.8"
serde_json     = "1"
tokio          = { version = "1", features = ["full"] }
quinn          = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls         = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
rcgen          = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
sha2           = "0.10"
anyhow         = "1"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
semver         = { version = "1", features = ["serde"] }
thiserror      = "1"
rodio          = { version = "0.20", default-features = false, features = ["wav", "vorbis", "mp3"] }
dirs           = "5"
base64         = "0.22"
egui           = "0.30"
egui-wgpu      = "0.30"
egui-winit     = "0.30"
chrono         = "0.4.44"
flate2         = "1"
# ZIP compatibility, CRC checks and archive metadata are handled by the archive library.
zip            = { version = "6", default-features = false, features = ["deflate-flate2"] }
glyphon        = "0.7"
tobj           = "4"
gltf           = { version = "1", default-features = false, features = ["utils", "import"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock    = "0.4"
seccompiler = "0.4"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
] }
