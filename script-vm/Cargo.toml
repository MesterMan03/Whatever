[package]
name = "whatever-script-vm"
version.workspace = true
edition = "2024"
publish = false

[lib]
crate-type = ["dylib"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scoped-tls-hkt = "0.1"
wasmtime = { version = "50", default-features = false, features = ["anyhow", "cranelift", "runtime", "std"] }
