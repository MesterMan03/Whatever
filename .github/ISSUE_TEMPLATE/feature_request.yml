name: Feature Request
description: Propose a new engine feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, check that it belongs in the engine rather than a mod.
        The engine owns: window, GPU renderer, VFS, mod loader, and scripting host — nothing else.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to accomplish that you currently can't?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should this be implemented? Which engine subsystem does it touch?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about, and why you prefer the proposal.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This feature belongs in the engine, not a mod
          required: true
        - label: This feature does not add game logic to the engine
          required: true
