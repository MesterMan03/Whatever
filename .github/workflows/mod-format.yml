name: Mod formatting

on:
  pull_request:
    paths:
      - "mods/**"
      - "games/**"
      - "biome.json"
      - ".editorconfig"
      - ".gitattributes"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mod-format.yml"
  push:
    branches: [main]
    paths:
      - "mods/**"
      - "games/**"
      - "biome.json"
      - ".editorconfig"
      - ".gitattributes"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mod-format.yml"
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run format:check
