name: Mod formatting

on:
  pull_request:
    paths:
      - "mods/**"
      - "games/**"
      - "biome.json"
      - ".editorconfig"
      - ".gitattributes"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/mod-format.yml"
  push:
    branches: [main]
    paths:
      - "mods/**"
      - "games/**"
      - "biome.json"
      - ".editorconfig"
      - ".gitattributes"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/mod-format.yml"
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
