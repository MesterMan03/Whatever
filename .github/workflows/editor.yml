name: Editor distributions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: portable-editor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor:
    name: Editor (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            architecture: x86_64
          - os: ubuntu-24.04
            platform: linux
            architecture: x86_64
          - os: macos-15
            platform: macos
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      WHATEVER_TEST_PROFILE: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: portable-editor
          cache-on-failure: true
      - name: Restore optimized build outputs
        uses: actions/cache/restore@v4
        id: release-cache
        with:
          path: target/release
          key: editor-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config*') }}
      - name: Linux desktop and packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config patchelf libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libasound2-dev libgl1 libegl1 libvulkan1
      - name: Install Open Watcom for the DOS launcher stub
        if: runner.os == 'Windows'
        uses: open-watcom/setup-watcom@v1
        with:
          version: '2.0-64'
          tag: '2026-11-01-Build'
          target: dos
      - uses: ./.github/actions/build-embedded-runtime
      - name: Check Rust formatting and lints
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --release --locked -- -D warnings
      - name: Check mod formatting
        shell: bash
        run: bun run format:check
      - name: Build release workspace
        shell: bash
        run: bun tools/build-native.ts --release
      - name: Save optimized build outputs before testing and packaging
        if: steps.release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/release
          key: ${{ steps.release-cache.outputs.cache-primary-key }}
      - name: Test the release build
        shell: bash
        run: |
          cargo test --workspace --release --locked -- --include-ignored
          bun run test:network
          bun run test:runtime
          bun run test:embedded
          bun run test:coinwatch
          bun run test:components
          bun run test:snapshots
          bun run test:server -- --bail=1
          bun run test:mods
          bun run test:project
          bun run test:markbench
      - name: Assemble, relocate, smoke-test and archive editor
        shell: bash
        run: bun run package:editor
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - name: Install Windows MSI build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Rust cache cleanup removes NuGet metadata inside target/. Keep tools separate.
          $wixTools = Join-Path $env:RUNNER_TEMP 'whatever-wix'
          dotnet tool install wix --version 5.0.2 --tool-path $wixTools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wix = Join-Path $wixTools 'wix.exe'
          & $wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Split-Path $wix) >> $env:GITHUB_PATH
      - name: Build the platform installer
        shell: bash
        run: bun run package:installers -- --source "dist/WhateverEditor-${{ matrix.platform }}-${{ matrix.architecture }}"
      - name: Verify Windows installation, PATH registration and removal
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $upgrade = Join-Path $env:RUNNER_TEMP 'WhateverEditor-upgrade.msi'
          bun tools/package-installers.ts --source dist/WhateverEditor-windows-x86_64 --output $upgrade
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/test-msi.ps1 -Package dist/WhateverEditor-windows-x86_64.msi -UpgradePackage $upgrade
      - name: Verify Linux installation and command registration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo dpkg -i dist/WhateverEditor-linux-x86_64.deb
          test "$(command -v whatever-editor)" = /usr/bin/whatever-editor
          env -u LD_LIBRARY_PATH wmod --version
          sudo dpkg -r whatever-editor
          test ! -e /usr/bin/whatever-editor
          test ! -e /usr/bin/wmod
      - name: Verify macOS installation and command registration
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo installer -pkg dist/WhateverEditor-macos-arm64.pkg -target /
          test "$(cat /etc/paths.d/whatever-engine)" = '/Applications/Whatever Editor.app/Contents/MacOS'
          env -u DYLD_LIBRARY_PATH /bin/zsh -lc 'command -v whatever-editor && wmod --version'
      - uses: actions/upload-artifact@v4
        with:
          name: WhateverEditor-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.msi
            dist/*.deb
            dist/*.pkg
          if-no-files-found: error
          compression-level: 0
      - name: Preserve failed player diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-diagnostics-${{ matrix.platform }}
          retention-days: 3
          path: |
            target/ci-server-failures/
            target/coinwatch-qa/
            target/release/Whatever.exe
            target/release/Whatever
            target/release/*.dll
            target/release/*.so
            target/release/*.dylib
          if-no-files-found: ignore
