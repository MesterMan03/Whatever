name: Mod runtime
on:
  pull_request:
    paths:
      - ".gitattributes"
      - ".gitmodules"
      - "vendor/**"
      - "runtime/**"
      - "engine/**"
      - "player/**"
      - "editor/**"
      - "launcher/**"
      - "wmod/**"
      - "mods/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/**"
      - ".github/actions/build-mod-host/**"
      - ".github/workflows/mod-runtime.yml"
  push:
    branches: [main]
    paths:
      - ".gitattributes"
      - ".gitmodules"
      - "vendor/**"
      - "runtime/**"
      - "engine/**"
      - "player/**"
      - "editor/**"
      - "launcher/**"
      - "wmod/**"
      - "mods/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/**"
      - ".github/actions/build-mod-host/**"
      - ".github/workflows/mod-runtime.yml"
  workflow_dispatch:

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/build-mod-host
      - name: Install Linux engine prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libasound2-dev
      - name: Build engine and test headless runtime
        shell: bash
        run: |
          cargo build --workspace --locked
          cargo test --workspace --locked
          bun run test:network
          bun run test:runtime
          bun run test:server
          bun run test:mods
          bun run test:project
          cargo test -p whatever-engine --locked client_ticks_without_redraws -- --ignored
          cargo test -p whatever-engine --locked network_messenger -- --ignored
