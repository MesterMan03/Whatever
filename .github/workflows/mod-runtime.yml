name: Mod runtime
on:
  pull_request:
    paths:
      - ".gitattributes"
      - "runtime/**"
      - "engine/**"
      - "script-vm/**"
      - "render-deps/**"
      - ".cargo/**"
      - "player/**"
      - "editor/**"
      - "launcher/**"
      - "dosstub/**"
      - "wmod/**"
      - "games/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "tools/**"
      - ".github/actions/build-embedded-runtime/**"
      - ".github/workflows/mod-runtime.yml"
  push:
    branches: [main]
    paths:
      - ".gitattributes"
      - "runtime/**"
      - "engine/**"
      - "script-vm/**"
      - "render-deps/**"
      - ".cargo/**"
      - "player/**"
      - "editor/**"
      - "launcher/**"
      - "dosstub/**"
      - "wmod/**"
      - "games/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "tools/**"
      - ".github/actions/build-embedded-runtime/**"
      - ".github/workflows/mod-runtime.yml"
  workflow_dispatch:

concurrency:
  group: mod-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mod-runtime
          cache-on-failure: true
      - name: Install Linux engine prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends pkg-config patchelf libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libasound2-dev
      - name: Install Open Watcom for the DOS launcher stub
        if: runner.os == 'Windows'
        uses: open-watcom/setup-watcom@v1
        with:
          version: '2.0-64'
          tag: '2026-11-01-Build'
          target: dos
      - uses: ./.github/actions/build-embedded-runtime
      - name: Build engine and test headless runtime
        shell: bash
        run: |
          node tools/build-native.ts
          cargo test --workspace --locked
          npm run test:network
          npm run test:runtime
          npm run test:embedded
          npm run test:coinwatch
          npm run test:server
          npm run test:mods
          npm run test:project
          cargo test -p whatever-engine --locked client_ticks_without_redraws -- --ignored
          cargo test -p whatever-engine --locked network_messenger -- --ignored
      - name: Preserve failed player diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: player-diagnostics-${{ runner.os }}
          retention-days: 3
          path: |
            target/ci-server-failures/
            target/debug/Whatever.exe
            target/debug/Whatever
            target/debug/*.dll
          if-no-files-found: ignore
