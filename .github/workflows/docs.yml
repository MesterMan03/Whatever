name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'runtime/**'
      - 'engine/src/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'runtime/**'
      - 'engine/src/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  examples:
    name: Check documented TypeScript examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install API development dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Rebuild API declarations and type-check examples
        run: bun run docs:check-examples

  build:
    name: Build and check docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install docs dependencies
        run: bun install --frozen-lockfile
      - name: Default to a project-site URL for pull request checks
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          owner="${REPOSITORY%%/*}"
          repo="${REPOSITORY#*/}"
          echo "DOCS_SITE=https://${owner,,}.github.io" >> "$GITHUB_ENV"
          if [[ "${repo,,}" == "${owner,,}.github.io" ]]; then
            echo 'DOCS_BASE=/' >> "$GITHUB_ENV"
          else
            echo "DOCS_BASE=/$repo" >> "$GITHUB_ENV"
          fi
      - name: Read GitHub Pages configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5
      - name: Use configured Pages URL
        if: steps.pages.outcome == 'success'
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "DOCS_SITE=$PAGES_ORIGIN" >> "$GITHUB_ENV"
          echo "DOCS_BASE=${PAGES_BASE:-/}" >> "$GITHUB_ENV"
      - name: Build, index search, and verify links
        run: bun run build
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, examples]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
