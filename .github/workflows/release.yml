name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  editor:
    uses: ./.github/workflows/editor.yml
  release:
    name: Publish portable editor archives
    needs: editor
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WhateverEditor-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            WhateverEditor-windows-x86_64.zip
            WhateverEditor-linux-x86_64.tar.gz
            WhateverEditor-macos-arm64.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
