name: Publish Package to npm

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --cwd runtime

      - name: Build package
        run: bun run build:runtime

      # Publish using OIDC (no tokens passed in env)
      - name: Publish to npm
        run: cd runtime && bunx npm publish --provenance