name: Publish Package to npm

on:
  release:
    types:
      - published
  repository_dispatch:
    types:
      - publish-npm
  workflow_dispatch:

concurrency:
  group: publish-npm-${{ github.event.client_payload.ref || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    environment: npm-publish

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.client_payload.ref || github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: "https://registry.npmjs.org"
          token: "${{ github.server_url == 'https://github.com' && github.token || '' }}"

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies and verify release version
        env:
          RELEASE_TAG: ${{ github.event.client_payload.ref || github.event.release.tag_name || github.ref_name }}
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run check:versions --tag "$RELEASE_TAG"

      - name: Check whether this commit is already published
        id: published
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { version } = JSON.parse(readFileSync('runtime/package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/@whatever-engine%2fapi/${version}`);
          if (response.status !== 404 && !response.ok) throw Error(`npm registry returned ${response.status}`);
          if (response.ok) {
            const published = await response.json();
            const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            if (published.gitHead !== commit) throw Error(`${version} already belongs to a different commit`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${response.ok}\n`);
          JS

      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        working-directory: runtime
        run: npm publish --access public --provenance
