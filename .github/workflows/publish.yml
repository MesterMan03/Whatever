name: Publish Package to npm

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest

    environment: npm-publish

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'  # this line is mandatory

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --cwd runtime

      # Publish using OIDC (no tokens passed in env)
      - name: Publish to npm
        run: cd runtime && npm publish --provenance --access public