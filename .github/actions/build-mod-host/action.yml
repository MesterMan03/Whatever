name: Build mod host
description: Build the pinned Bun fork and self-contained Whatever mod host
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.4.4"

    - name: Install Linux native build prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build nasm perl pkg-config libatomic1 gnupg
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/whatever-llvm.gpg >/dev/null
        echo "deb [signed-by=/usr/share/keyrings/whatever-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/whatever-llvm.list
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends clang-23 lld-23 llvm-23-dev
        echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"

    - name: Install portable Windows native build prerequisites
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $tools = Join-Path $env:GITHUB_WORKSPACE 'target/build-tools'
        New-Item -ItemType Directory -Path $tools -Force | Out-Null
        $llvm = Join-Path $tools 'llvm.tar.zst'
        curl.exe --fail --silent --show-error --location --output $llvm 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/clang%2Bllvm-23.1.1-x86_64-pc-windows-msvc.tar.zst'
        if ($LASTEXITCODE -ne 0) { throw 'LLVM download failed' }
        tar.exe -xf $llvm -C $tools
        if ($LASTEXITCODE -ne 0) { throw 'LLVM extraction failed' }
        $nasm = Join-Path $tools 'nasm.zip'
        curl.exe --fail --silent --show-error --location --output $nasm 'https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip'
        if ($LASTEXITCODE -ne 0) { throw 'NASM download failed' }
        Expand-Archive -LiteralPath $nasm -DestinationPath $tools -Force

    - name: Install JavaScript build dependencies
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts

    - name: Prepare fork patch
      shell: bash
      run: bun run prepare:bun

    - name: Build native runtime
      shell: bash
      run: bun run build:bun

    - name: Build API and bundled mod host
      shell: bash
      run: |
        bun run build:runtime
        bun run build:host

    - name: Test bundled mod host
      shell: bash
      run: bun run test:host