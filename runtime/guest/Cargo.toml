[package]
name = "whatever-script-guest"
version = "0.8.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
rquickjs = { version = "0.14", default-features = false, features = ["std", "loader", "array-buffer"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
