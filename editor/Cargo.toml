[package]
name = "whatever-editor"
version = "0.6.0"
edition = "2024"
publish = false

[dependencies]
whatever_engine = { package = "whatever-engine", path = "../engine" }
anyhow = "1"
egui = "0.30"
egui-wgpu = "0.30"
egui-winit = "0.30"
glam = "0.29"
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = "0.30"
rfd = "0.17.2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
muda = { version = "0.21.2", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }
